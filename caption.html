<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Caption Library | SS TIME OFFICIAL</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Firebase Compat SDKs (Production) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-base: #050811;
      --card-bg: rgba(13, 19, 36, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(20, 28, 52, 0.9);
      --reader-bg: #090e1c;
      --primary: #06b6d4;
      --primary-light: #67e8f9;
      --accent: #6366f1;
      --accent-glow: rgba(6, 182, 212, 0.35);
      --cyan-badge: rgba(6, 182, 212, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --input-bg: rgba(10, 15, 28, 0.82);
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-base); min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

    #authGuard { position: fixed; inset: 0; background: #050811; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .guard-spinner { width: 46px; height: 46px; border: 3px solid rgba(255, 255, 255, 0.08); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bg-mesh { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ambient-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.65; pointer-events: none; }
    .orb-1 { width: 320px; height: 320px; background: radial-gradient(circle, rgba(6, 182, 212, 0.28), transparent 70%); top: -40px; left: 15%; }
    .orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, rgba(99, 102, 241, 0.22), transparent 70%); bottom: 5%; right: 10%; }

    .top-appbar { position: sticky; top: 0; z-index: 100; background: rgba(8, 12, 24, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); padding: 14px 18px; }
    .appbar-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .left-controls { display: flex; align-items: center; gap: 12px; }
    .btn-back-home { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; font-size: 1rem; }

    .brand-meta h1 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(135deg, #ffffff 30%, #67e8f9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-meta span { font-size: 0.74rem; color: var(--primary-light); font-weight: 600; }
    .header-badge-count { background: var(--cyan-badge); border: 1px solid rgba(6, 182, 212, 0.35); color: #67e8f9; font-size: 0.76rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }

    .content-wrapper { max-width: 1000px; width: 100%; margin: 0 auto; padding: 18px 16px 60px 16px; flex: 1; position: relative; z-index: 10; }
    .search-panel { position: relative; margin-bottom: 20px; }
    .search-panel i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
    .search-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 40px 12px 44px; color: #ffffff; font-size: 0.9rem; outline: none; }

    .caption-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .caption-compact-card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(18px); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .serial-badge { font-size: 0.74rem; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--primary-light); background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.3); padding: 2px 8px; border-radius: 6px; }
    .version-tag-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 700; color: #6ee7b7; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); padding: 2px 7px; border-radius: 6px; }

    .caption-preview-box { font-size: 0.9rem; color: #cbd5e1; line-height: 1.65; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; background: rgba(10, 15, 29, 0.65); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; padding: 10px 12px; }
    .card-bottom-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 12px; }
    
    .card-action-bar { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .btn-card { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); padding: 9px 12px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1; }
    .btn-primary-view { background: linear-gradient(135deg, var(--accent), #4f46e5); border: none; color: #ffffff; }
    .btn-copy-card { background: rgba(6, 182, 212, 0.12); border-color: rgba(6, 182, 212, 0.35); color: #67e8f9; }

    .reader-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
    .reader-modal-sheet { background: var(--reader-bg); border: 1px solid var(--card-border); border-radius: 24px 24px 0 0; width: 100%; max-width: 760px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .reader-header { background: rgba(13, 19, 36, 0.95); border-bottom: 1px solid var(--card-border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .version-navigator-bar { background: rgba(10, 15, 28, 0.85); border-bottom: 1px solid var(--card-border); padding: 10px 18px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .version-tab-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 14px; border-radius: 8px; font-size: 0.76rem; font-weight: 700; font-family: 'Fira Code', monospace; cursor: pointer; white-space: nowrap; }
    .version-tab-btn.active { background: var(--primary); border-color: var(--primary); color: #000000; font-weight: 800; }
    
    .reader-content-body { padding: 22px 20px; overflow-y: auto; flex: 1; }
    .formatted-caption-text { font-size: 1.05rem; line-height: 1.85; color: #f1f5f9; white-space: pre-wrap; word-break: break-word; user-select: all; }
    .reader-footer-actions { background: rgba(13, 19, 36, 0.95); border-top: 1px solid var(--card-border); padding: 14px 18px; display: flex; }
    .btn-copy-modal-main { width: 100%; background: linear-gradient(135deg, var(--primary), #0284c7); color: #ffffff; border: none; padding: 13px 16px; border-radius: 12px; font-size: 0.92rem; font-weight: 700; cursor: pointer; }

    .toast-msg { position: fixed; bottom: 24px; right: 20px; background: #1e1b4b; border: 1px solid #6366f1; color: #ffffff; padding: 12px 20px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 600; z-index: 2000; opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; }
    .toast-msg.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div id="authGuard">
    <div class="guard-spinner"></div>
    <p style="color: #94a3b8; font-size: 0.88rem;">Connecting Library... • ক্যাপশন লোড হচ্ছে...</p>
  </div>

  <div class="bg-mesh">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <header class="top-appbar">
    <div class="appbar-inner">
      <div class="left-controls">
        <a href="home.html" class="btn-back-home" title="Back to Home">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="brand-meta">
          <h1 id="groupTitle">SS TIME OFFICIAL</h1>
          <span>Caption Library • ক্যাপশন লাইব্রেরি</span>
        </div>
      </div>

      <div class="header-badge-count">
        <i class="fa-solid fa-quote-left"></i>
        <span id="totalCaptionsCount">0 Total</span>
      </div>
    </div>
  </header>

  <main class="content-wrapper">
    <div class="search-panel">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="captionSearchInput" class="search-input" placeholder="Search caption text, serial #1... / ক্যাপশন অনুসন্ধান..." />
    </div>

    <section class="caption-grid" id="captionGridContainer"></section>
  </main>

  <!-- Full Mobile Caption Modal -->
  <div id="readerModal" class="reader-modal-overlay">
    <div class="reader-modal-sheet">
      <div class="reader-header">
        <div>
          <h3 id="readerCaptionTitle" style="color:#fff;">Caption</h3>
          <span id="readerSubtitle" style="font-size:0.75rem; color:var(--primary-light);">Full View</span>
        </div>
        <button style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;" onclick="closeModal()">&times;</button>
      </div>

      <div class="version-navigator-bar" id="readerVersionBar"></div>

      <div class="reader-content-body">
        <div class="formatted-caption-text" id="readerCaptionBody"></div>
      </div>

      <div class="reader-footer-actions">
        <button class="btn-copy-modal-main" id="btnCopyModalCaption">
          <i class="fa-regular fa-clipboard"></i> Copy Caption / ক্যাপশন কপি করুন
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">Caption copied ✓</span>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjh-etprmOrbu7UMYNXXHdNXgiVPCxywY",
      authDomain: "alifi-1e15c.firebaseapp.com",
      databaseURL: "https://alifi-1e15c-default-rtdb.firebaseio.com",
      projectId: "alifi-1e15c",
      storageBucket: "alifi-1e15c.firebasestorage.app",
      messagingSenderId: "928673744418",
      appId: "1:928673744418:web:997a8db27cae1fa15c6c7b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const authGuard = document.getElementById('authGuard');
    const groupTitle = document.getElementById('groupTitle');
    const totalCaptionsCount = document.getElementById('totalCaptionsCount');
    const captionSearchInput = document.getElementById('captionSearchInput');
    const captionGridContainer = document.getElementById('captionGridContainer');
    const readerModal = document.getElementById('readerModal');
    const readerCaptionTitle = document.getElementById('readerCaptionTitle');
    const readerVersionBar = document.getElementById('readerVersionBar');
    const readerCaptionBody = document.getElementById('readerCaptionBody');
    const btnCopyModalCaption = document.getElementById('btnCopyModalCaption');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    let groupedCaptions = [];
    let currentSearchTerm = '';
    let currentReadingGroup = null;
    let activeVersionIndex = 0;

    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      authGuard.style.display = 'none';
      initRealtime();
    });

    function initRealtime() {
      db.ref('settings/groupName').on('value', snap => {
        if (snap.val()) groupTitle.textContent = snap.val().trim();
      });

      // Synchronize directly from captions & contents nodes
      db.ref('captions').on('value', snapCaptions => {
        const captionsObj = snapCaptions.val() || {};
        db.ref('contents').on('value', snapContents => {
          const contentsObj = snapContents.val() || {};
          processMergedCaptions({ ...contentsObj, ...captionsObj });
          renderCaptions();
        });
      });
    }

    function processMergedCaptions(mergedObj) {
      const rawList = [];

      Object.keys(mergedObj).forEach(key => {
        const item = mergedObj[key];
        if (!item || typeof item !== 'object') return;

        // Check if published
        const isPublished = (item.status === 'published' || item.published === true) && item.status !== 'unpublished' && item.published !== false;
        if (!isPublished) return;

        // Parse versions list
        const vList = [];
        if (item.versions && typeof item.versions === 'object') {
          Object.keys(item.versions).forEach(vKey => {
            const v = item.versions[vKey];
            if (v && (v.published !== false)) {
              const textVal = v.text || v.caption || v.content || v.details || '';
              if (textVal.trim()) {
                vList.push({
                  versionName: v.version || 'Version 1',
                  text: textVal,
                  timestamp: v.updatedAt || v.createdAt || item.updatedAt || Date.now()
                });
              }
            }
          });
        }

        // Direct text extraction if no nested versions
        const directText = item.text || item.caption || item.content || item.details || item.latestText || (vList[0] ? vList[0].text : '');
        if (!directText.trim()) return;

        if (vList.length === 0) {
          vList.push({
            versionName: item.currentVersion || item.version || 'Version 1',
            text: directText,
            timestamp: item.updatedAt || item.createdAt || Date.now()
          });
        }

        vList.sort((a, b) => b.timestamp - a.timestamp);

        rawList.push({
          id: key,
          serial: item.serial || 1,
          title: item.title || `Caption #${item.serial || 1}`,
          versions: vList,
          latestVersion: vList[0],
          timestamp: item.updatedAt || item.createdAt || Date.now()
        });
      });

      // Group by ID or unique snippet so duplicates merge
      const groups = {};
      rawList.forEach(item => {
        const gKey = item.id;
        if (!groups[gKey]) {
          groups[gKey] = {
            groupKey: gKey,
            serial: item.serial,
            title: item.title,
            versions: [...item.versions],
            latestTime: item.timestamp
          };
        } else {
          groups[gKey].versions.push(...item.versions);
          if (item.timestamp > groups[gKey].latestTime) groups[gKey].latestTime = item.timestamp;
        }
      });

      groupedCaptions = Object.values(groups).sort((a, b) => a.serial - b.serial);

      groupedCaptions.forEach((g, idx) => {
        g.autoSerial = g.serial || (idx + 1);
        g.versions.sort((a, b) => b.timestamp - a.timestamp);
        g.latestVersion = g.versions[0];
      });

      totalCaptionsCount.textContent = `${groupedCaptions.length} Total`;
    }

    function renderCaptions() {
      const q = currentSearchTerm.toLowerCase().trim();

      const filtered = groupedCaptions.filter(g => {
        if (q) {
          return `#${g.autoSerial}`.includes(q) || 
                 g.versions.some(v => v.text.toLowerCase().includes(q)) || 
                 (g.title && g.title.toLowerCase().includes(q));
        }
        return true;
      });

      if (filtered.length === 0) {
        captionGridContainer.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:50px;color:#94a3b8;">
            <i class="fa-solid fa-quote-right" style="font-size:2rem;margin-bottom:10px;"></i>
            <p>কোনো Caption পাওয়া যায়নি • No Caption found</p>
          </div>
        `;
        return;
      }

      captionGridContainer.innerHTML = filtered.map(g => {
        const latest = g.latestVersion;
        const dateStr = new Date(g.latestTime).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

        return `
          <div class="caption-compact-card">
            <div>
              <div class="card-top-row">
                <span class="serial-badge">#${g.autoSerial}</span>
                <div class="version-tag-pill">
                  <i class="fa-solid fa-sparkles"></i> Latest (${escapeHTML(latest.versionName)})
                </div>
              </div>

              <div class="caption-preview-box">${escapeHTML(latest.text)}</div>

              <div class="card-bottom-meta">
                <span><i class="fa-regular fa-clock"></i> ${dateStr}</span>
                <span>${g.versions.length} Version${g.versions.length > 1 ? 's' : ''}</span>
              </div>
            </div>

            <div class="card-action-bar">
              <button class="btn-card btn-primary-view" onclick="openReader('${g.groupKey}')">
                <i class="fa-solid fa-eye"></i> View
              </button>
              <button class="btn-card btn-copy-card" onclick="copyDirect('${g.groupKey}')">
                <i class="fa-regular fa-copy"></i> Copy
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openReader = function(key) {
      const g = groupedCaptions.find(item => item.groupKey === key);
      if (!g) return;

      currentReadingGroup = g;
      activeVersionIndex = 0;

      readerCaptionTitle.textContent = `Caption #${g.autoSerial}`;
      renderVersionTabs();
      renderActiveText();

      readerModal.style.display = 'flex';
    };

    function renderVersionTabs() {
      if (!currentReadingGroup) return;
      readerVersionBar.innerHTML = currentReadingGroup.versions.map((v, i) => `
        <button class="version-tab-btn ${i === activeVersionIndex ? 'active' : ''}" onclick="switchVer(${i})">
          ${i === 0 ? 'Latest ' : ''}(${escapeHTML(v.versionName)})
        </button>
      `).join('');
    }

    window.switchVer = function(idx) {
      activeVersionIndex = idx;
      renderVersionTabs();
      renderActiveText();
    };

    function renderActiveText() {
      if (!currentReadingGroup) return;
      readerCaptionBody.textContent = currentReadingGroup.versions[activeVersionIndex].text;
    }

    function closeModal() {
      readerModal.style.display = 'none';
      currentReadingGroup = null;
    }

    window.copyDirect = function(key) {
      const g = groupedCaptions.find(item => item.groupKey === key);
      if (!g) return;
      copyClipboard(g.latestVersion.text, '✓ Caption copied • ক্যাপশন কপি হয়েছে');
    };

    btnCopyModalCaption.onclick = () => {
      if (!currentReadingGroup) return;
      copyClipboard(currentReadingGroup.versions[activeVersionIndex].text, '✓ Caption copied • ক্যাপশন কপি হয়েছে');
    };

    function copyClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(msg);
      });
    }

    captionSearchInput.oninput = e => {
      currentSearchTerm = e.target.value;
      renderCaptions();
    };

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function escapeHTML(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
