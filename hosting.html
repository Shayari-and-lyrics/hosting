<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <title>Hosting Library | SS TIME OFFICIAL</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Firebase Compat SDKs (Production) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-base: #050811;
      --card-bg: rgba(13, 19, 36, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(20, 28, 52, 0.9);
      --reader-bg: #090e1c;
      --primary: #6366f1;
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --input-bg: rgba(10, 15, 28, 0.82);
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: var(--bg-base); min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

    #authGuard { position: fixed; inset: 0; background: #050811; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .guard-spinner { width: 46px; height: 46px; border: 3px solid rgba(255, 255, 255, 0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bg-mesh { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ambient-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.65; pointer-events: none; }
    .orb-1 { width: 320px; height: 320px; background: radial-gradient(circle, rgba(99, 102, 241, 0.3), transparent 70%); top: -40px; left: 15%; }
    .orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, rgba(6, 182, 212, 0.22), transparent 70%); bottom: 5%; right: 10%; }

    .top-appbar { position: sticky; top: 0; z-index: 100; background: rgba(8, 12, 24, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); padding: 14px 18px; }
    .appbar-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .left-controls { display: flex; align-items: center; gap: 12px; }
    .btn-back-home { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; font-size: 1rem; }
    .brand-meta h1 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-meta span { font-size: 0.74rem; color: var(--accent); font-weight: 600; }
    .header-badge-count { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.35); color: #a5b4fc; font-size: 0.76rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }

    .content-wrapper { max-width: 1000px; width: 100%; margin: 0 auto; padding: 18px 16px 60px 16px; flex: 1; position: relative; z-index: 10; }
    .search-panel { position: relative; margin-bottom: 16px; }
    .search-panel i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
    .search-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 40px 12px 44px; color: #ffffff; font-size: 0.9rem; outline: none; }

    .category-scroll-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; scrollbar-width: none; }
    .category-scroll-bar::-webkit-scrollbar { display: none; }
    .cat-chip { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 16px; border-radius: 12px; font-size: 0.84rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .cat-chip.active { background: linear-gradient(135deg, var(--primary), #3b82f6); border-color: transparent; color: #ffffff; }

    .hosting-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .hosting-compact-card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(18px); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .serial-badge { font-size: 0.72rem; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--accent); background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.3); padding: 2px 8px; border-radius: 6px; }
    
    .cat-tag { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .cat-ss-time { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
    .cat-birthday { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
    .cat-event { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .cat-anniversary { background: rgba(245, 158, 11, 0.15); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }

    .card-hosting-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
    .presenter-line { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .version-meta-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 700; color: #6ee7b7; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); padding: 2px 7px; border-radius: 6px; margin-bottom: 10px; }
    .short-preview-snippet { font-size: 0.84rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; background: rgba(10, 15, 29, 0.6); border-left: 2.5px solid var(--accent); border-radius: 0 6px 6px 0; padding: 8px 10px; }
    .card-bottom-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 12px; }
    .btn-read-hosting { width: 100%; background: linear-gradient(135deg, var(--primary), #3b82f6); color: #ffffff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .reader-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
    .reader-modal-sheet { background: var(--reader-bg); border: 1px solid var(--card-border); border-radius: 24px 24px 0 0; width: 100%; max-width: 900px; height: 94vh; display: flex; flex-direction: column; overflow: hidden; }
    .reader-header { background: rgba(13, 19, 36, 0.95); border-bottom: 1px solid var(--card-border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .version-navigator-bar { background: rgba(10, 15, 28, 0.85); border-bottom: 1px solid var(--card-border); padding: 10px 18px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .version-tab-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 14px; border-radius: 8px; font-size: 0.76rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .version-tab-btn.active { background: var(--primary); border-color: var(--primary); color: #ffffff; }

    .reader-content-body { padding: 22px 20px; overflow-y: auto; flex: 1; }
    .formatted-script-text { font-size: 0.98rem; line-height: 1.85; color: #f1f5f9; white-space: pre-wrap; word-break: break-word; }
    .reader-footer-actions { background: rgba(13, 19, 36, 0.95); border-top: 1px solid var(--card-border); padding: 14px 18px; display: flex; gap: 10px; }
    .btn-copy-main { background: linear-gradient(135deg, var(--accent), #0284c7); color: #ffffff; border: none; padding: 12px 16px; border-radius: 12px; font-size: 0.88rem; font-weight: 700; cursor: pointer; flex: 1; }

    .toast-msg { position: fixed; bottom: 24px; right: 20px; background: #1e1b4b; border: 1px solid #6366f1; color: #ffffff; padding: 12px 20px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 600; z-index: 2000; opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; }
    .toast-msg.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div id="authGuard">
    <div class="guard-spinner"></div>
    <p style="color: #94a3b8; font-size: 0.88rem;">Connecting Library... • হোস্টিং লোড হচ্ছে...</p>
  </div>

  <div class="bg-mesh">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <header class="top-appbar">
    <div class="appbar-inner">
      <div class="left-controls">
        <a href="home.html" class="btn-back-home" title="Back to Home">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="brand-meta">
          <h1 id="groupTitle">SS TIME OFFICIAL</h1>
          <span>Hosting Library • হোস্টিং লাইব্রেরি</span>
        </div>
      </div>

      <div class="header-badge-count">
        <i class="fa-solid fa-scroll"></i>
        <span id="totalHostingsCount">0 Total</span>
      </div>
    </div>
  </header>

  <main class="content-wrapper">
    <div class="search-panel">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="hostingSearchInput" class="search-input" placeholder="Search title, presenter (e.g. Mariya)... / অনুসন্ধান..." />
    </div>

    <div class="category-scroll-bar" id="categoryFilterBar">
      <button class="cat-chip active" data-category="all">All / সব</button>
      <button class="cat-chip" data-category="SS Time">🎤 SS Time</button>
      <button class="cat-chip" data-category="Birthday">🎂 Birthday</button>
      <button class="cat-chip" data-category="Event">🎉 Event</button>
      <button class="cat-chip" data-category="Anniversary">💍 Anniversary</button>
    </div>

    <section class="hosting-grid" id="hostingGridContainer"></section>
  </main>

  <!-- Full Mobile Reading View -->
  <div id="readerModal" class="reader-modal-overlay">
    <div class="reader-modal-sheet">
      <div class="reader-header">
        <div>
          <h3 id="readerHostingTitle" style="color:#fff;">Hosting Title</h3>
          <span id="readerCategoryPresenter" style="font-size:0.75rem; color:var(--accent);">Category • Presenter</span>
        </div>
        <button style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;" onclick="closeReader()">&times;</button>
      </div>

      <div class="version-navigator-bar" id="readerVersionBar"></div>

      <div class="reader-content-body">
        <div class="formatted-script-text" id="readerScriptBody"></div>
      </div>

      <div class="reader-footer-actions">
        <button class="btn-copy-main" id="btnCopyFullHosting">
          <i class="fa-regular fa-clipboard"></i> Copy Full Hosting / সম্পূর্ণ কপি
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">Hosting copied successfully ✓</span>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjh-etprmOrbu7UMYNXXHdNXgiVPCxywY",
      authDomain: "alifi-1e15c.firebaseapp.com",
      databaseURL: "https://alifi-1e15c-default-rtdb.firebaseio.com",
      projectId: "alifi-1e15c",
      storageBucket: "alifi-1e15c.firebasestorage.app",
      messagingSenderId: "928673744418",
      appId: "1:928673744418:web:997a8db27cae1fa15c6c7b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const authGuard = document.getElementById('authGuard');
    const groupTitle = document.getElementById('groupTitle');
    const totalHostingsCount = document.getElementById('totalHostingsCount');
    const hostingSearchInput = document.getElementById('hostingSearchInput');
    const categoryFilterBar = document.getElementById('categoryFilterBar');
    const hostingGridContainer = document.getElementById('hostingGridContainer');

    const readerModal = document.getElementById('readerModal');
    const readerHostingTitle = document.getElementById('readerHostingTitle');
    const readerCategoryPresenter = document.getElementById('readerCategoryPresenter');
    const readerVersionBar = document.getElementById('readerVersionBar');
    const readerScriptBody = document.getElementById('readerScriptBody');
    const btnCopyFullHosting = document.getElementById('btnCopyFullHosting');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    let groupedHostings = [];
    let currentFilterCategory = 'all';
    let currentSearchTerm = '';
    let currentReadingGroup = null;
    let activeVersionIndex = 0;

    // Authentication Guard
    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      authGuard.style.display = 'none';
      initRealtime();
    });

    function initRealtime() {
      db.ref('settings/groupName').on('value', snap => {
        if (snap.val()) groupTitle.textContent = snap.val().trim();
      });

      // Synchronize directly from hostings & contents
      db.ref('hostings').on('value', snapHostings => {
        const hostingsObj = snapHostings.val() || {};
        db.ref('contents').on('value', snapContents => {
          const contentsObj = snapContents.val() || {};
          processMergedData({ ...contentsObj, ...hostingsObj });
          renderCards();
        });
      });
    }

    function processMergedData(mergedObj) {
      const rawList = [];

      Object.keys(mergedObj).forEach(key => {
        const item = mergedObj[key];
        if (!item || typeof item !== 'object') return;

        // Ensure item is published
        const isPublished = (item.status === 'published' || item.published === true) && item.status !== 'unpublished' && item.published !== false;
        if (!isPublished) return;

        // Parse versions list if nested
        const vList = [];
        if (item.versions && typeof item.versions === 'object') {
          Object.keys(item.versions).forEach(vKey => {
            const v = item.versions[vKey];
            if (v && (v.published !== false)) {
              vList.push({
                versionName: v.version || 'Version 1',
                script: v.script || v.content || '',
                presenter: v.presenter || item.presenter || '',
                timestamp: v.updatedAt || v.createdAt || item.updatedAt || Date.now()
              });
            }
          });
        }

        // Extract script safely
        const mainScript = item.content || item.script || item.details || item.hostingText || (vList[0] ? vList[0].script : '');
        if (!mainScript.trim()) return;

        if (vList.length === 0) {
          vList.push({
            versionName: item.currentVersion || item.version || 'Version 1',
            script: mainScript,
            presenter: item.presenter || '',
            timestamp: item.updatedAt || item.createdAt || Date.now()
          });
        }

        vList.sort((a, b) => b.timestamp - a.timestamp);

        rawList.push({
          id: key,
          serial: item.serial || 1,
          title: (item.title || item.name || 'Untitled Hosting').trim(),
          category: normalizeCategory(item.category),
          presenter: item.presenter || vList[0].presenter || '',
          versions: vList,
          latestVersion: vList[0],
          timestamp: item.updatedAt || item.createdAt || Date.now()
        });
      });

      // Group by Title + Category so duplicate versions merge cleanly
      const groups = {};
      rawList.forEach(item => {
        const gKey = `${item.category}__${item.title.toLowerCase()}`;
        if (!groups[gKey]) {
          groups[gKey] = {
            groupKey: gKey,
            serial: item.serial,
            title: item.title,
            category: item.category,
            presenter: item.presenter,
            versions: [...item.versions],
            latestTime: item.timestamp
          };
        } else {
          // Merge versions
          groups[gKey].versions.push(...item.versions);
          if (item.timestamp > groups[gKey].latestTime) groups[gKey].latestTime = item.timestamp;
        }
      });

      groupedHostings = Object.values(groups).sort((a, b) => a.serial - b.serial);

      groupedHostings.forEach((g, idx) => {
        g.autoSerial = g.serial || (idx + 1);
        g.versions.sort((a, b) => b.timestamp - a.timestamp);
        g.latestVersion = g.versions[0];
      });

      totalHostingsCount.textContent = `${groupedHostings.length} Total`;
    }

    function normalizeCategory(c) {
      const s = (c || '').toLowerCase();
      if (s.includes('birthday')) return 'Birthday';
      if (s.includes('anniversary')) return 'Anniversary';
      if (s.includes('event')) return 'Event';
      return 'SS Time';
    }

    function renderCards() {
      const q = currentSearchTerm.toLowerCase().trim();

      const filtered = groupedHostings.filter(g => {
        if (currentFilterCategory !== 'all' && g.category !== currentFilterCategory) return false;
        if (q) {
          return g.title.toLowerCase().includes(q) || g.presenter.toLowerCase().includes(q) || `#${g.autoSerial}`.includes(q);
        }
        return true;
      });

      if (filtered.length === 0) {
        hostingGridContainer.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#94a3b8;"><i class="fa-solid fa-microphone-slash" style="font-size:2rem;margin-bottom:10px;"></i><p>কোনো Hosting পাওয়া যায়নি • No Hosting found</p></div>';
        return;
      }

      hostingGridContainer.innerHTML = filtered.map(g => {
        const latest = g.latestVersion;
        const dateStr = new Date(g.latestTime).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

        return `
          <div class="hosting-compact-card">
            <div>
              <div class="card-top-row">
                <span class="serial-badge">#${g.autoSerial}</span>
                <span class="cat-tag cat-ss-time">${escapeHTML(g.category)}</span>
              </div>

              <h4 class="card-hosting-title">${escapeHTML(g.title)}</h4>

              ${g.presenter ? `<div class="presenter-line">Presenter: <strong>${escapeHTML(g.presenter)}</strong></div>` : ''}

              <div class="version-meta-pill">
                <i class="fa-solid fa-bolt"></i> Latest (${escapeHTML(latest.versionName)})
                ${g.versions.length > 1 ? `<span style="color:#94a3b8;margin-left:4px;">(+${g.versions.length - 1} old)</span>` : ''}
              </div>

              <div class="short-preview-snippet">
                ${escapeHTML(latest.script)}
              </div>

              <div class="card-bottom-row">
                <span><i class="fa-regular fa-clock"></i> ${dateStr}</span>
                <span>${g.versions.length} Version${g.versions.length > 1 ? 's' : ''}</span>
              </div>
            </div>

            <button class="btn-read-hosting" onclick="openReader('${g.groupKey}')">
              <i class="fa-solid fa-book-open"></i> Read Hosting / স্ক্রিপ্ট পড়ুন
            </button>
          </div>
        `;
      }).join('');
    }

    window.openReader = function(key) {
      const g = groupedHostings.find(item => item.groupKey === key);
      if (!g) return;

      currentReadingGroup = g;
      activeVersionIndex = 0;

      readerHostingTitle.textContent = g.title;
      readerCategoryPresenter.textContent = `${g.category} • Presenter: ${g.presenter || 'None'}`;

      renderVersionTabs();
      renderActiveScript();

      readerModal.style.display = 'flex';
    };

    function renderVersionTabs() {
      if (!currentReadingGroup) return;
      readerVersionBar.innerHTML = currentReadingGroup.versions.map((v, i) => `
        <button class="version-tab-btn ${i === activeVersionIndex ? 'active' : ''}" onclick="switchVersion(${i})">
          ${i === 0 ? 'Latest ' : ''}(${escapeHTML(v.versionName)})
        </button>
      `).join('');
    }

    window.switchVersion = function(idx) {
      activeVersionIndex = idx;
      renderVersionTabs();
      renderActiveScript();
    };

    function renderActiveScript() {
      if (!currentReadingGroup) return;
      readerScriptBody.textContent = currentReadingGroup.versions[activeVersionIndex].script;
    }

    window.closeReader = function() {
      readerModal.style.display = 'none';
      currentReadingGroup = null;
    };

    btnCopyFullHosting.onclick = () => {
      if (!currentReadingGroup) return;
      const text = currentReadingGroup.versions[activeVersionIndex].script;
      navigator.clipboard.writeText(text).then(() => {
        showToast('Hosting copied successfully ✓');
      });
    };

    categoryFilterBar.onclick = e => {
      const btn = e.target.closest('.cat-chip');
      if (!btn) return;
      document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilterCategory = btn.dataset.category;
      renderCards();
    };

    hostingSearchInput.oninput = e => {
      currentSearchTerm = e.target.value;
      renderCards();
    };

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function escapeHTML(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
