<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Notice & Announcements | SS TIME OFFICIAL</title>

  <!-- Google Fonts: Hind Siliguri (Bengali), Plus Jakarta Sans & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Firebase Compat SDKs (Production) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* ==========================================================================
       1. LUXURY MOBILE-FIRST CSS VARIABLES & RESET
       ========================================================================== */
    :root {
      --bg-base: #050811;
      --card-bg: rgba(13, 19, 36, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(20, 28, 52, 0.9);
      --reader-bg: #090e1c;
      --primary: #f59e0b;
      --primary-light: #fbbf24;
      --accent: #06b6d4;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --amber-badge: rgba(245, 158, 11, 0.15);
      --emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --input-bg: rgba(10, 15, 28, 0.82);
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-main);
    }

    body {
      background-color: var(--bg-base);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Auth Verification Splash Guard */
    #authGuard {
      position: fixed;
      inset: 0;
      background: #050811;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .guard-spinner {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ambient Glowing Orbs Background */
    .bg-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.65;
      pointer-events: none;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25), transparent 70%);
      top: -40px;
      left: 15%;
    }

    .orb-2 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.2), transparent 70%);
      bottom: 5%;
      right: 10%;
    }

    /* ==========================================================================
       2. TOP APP BAR & NAVIGATION
       ========================================================================== */
    .top-appbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 12, 24, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: max(12px, env(safe-area-inset-top)) 18px 12px 18px;
    }

    .appbar-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back-home {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-back-home:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateX(-2px);
    }

    .btn-back-home:active {
      transform: scale(0.94);
    }

    .brand-meta h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #fde68a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .brand-meta span {
      font-size: 0.74rem;
      color: var(--primary-light);
      font-weight: 600;
    }

    .header-badge-count {
      background: var(--amber-badge);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ==========================================================================
       3. MAIN CONTAINER & SEARCH
       ========================================================================== */
    .content-wrapper {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 16px 60px 16px;
      flex: 1;
      position: relative;
      z-index: 10;
      animation: entrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes entrance {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Search Box */
    .search-panel {
      position: relative;
      margin-bottom: 20px;
    }

    .search-panel i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 40px 12px 44px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    .search-clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }

    /* ==========================================================================
       4. COMPACT NOTICE CARDS GRID
       ========================================================================== */
    .notice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .notice-compact-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: fadeInCard 0.35s ease-out;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .notice-compact-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .serial-badge {
      font-size: 0.74rem;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      color: var(--primary-light);
      background: var(--amber-badge);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .version-tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .notice-headline {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }

    .notice-headline i {
      color: var(--primary-light);
      font-size: 1.05rem;
    }

    /* Notice Text Box */
    .notice-text-box {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(10, 15, 29, 0.65);
      border-left: 3px solid var(--primary);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      max-height: 180px;
      overflow-y: auto;
    }

    .card-bottom-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .card-action-bar {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      flex: 1;
    }

    .btn-card:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn-card:active {
      transform: scale(0.96);
    }

    .btn-primary-view {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
      color: #fde68a;
    }

    .btn-primary-view:hover {
      background: rgba(245, 158, 11, 0.22);
      color: #ffffff;
    }

    .btn-copy-card {
      background: linear-gradient(135deg, var(--primary), #d97706);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }

    .btn-copy-card:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
    }

    /* Empty State Placeholder */
    .empty-placeholder {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 20px;
      color: var(--text-dim);
    }

    .empty-placeholder i {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    /* ==========================================================================
       5. FULL MOBILE NOTICE VIEW (BOTTOM SHEET DRAWER)
       ========================================================================== */
    .reader-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .reader-modal-sheet {
      background: var(--reader-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 760px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.8);
      animation: sheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      overflow: hidden;
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Sticky Modal Header */
    .reader-header {
      background: rgba(13, 19, 36, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .reader-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .btn-close-reader {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-close-reader:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .reader-title-box h3 {
      font-size: 1.05rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .reader-title-box span {
      font-size: 0.74rem;
      color: var(--primary-light);
      display: block;
    }

    /* Version Navigator Tabs inside Modal */
    .version-navigator-bar {
      background: rgba(10, 15, 28, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .version-navigator-bar::-webkit-scrollbar {
      display: none;
    }

    .version-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .version-tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #000000;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
    }

    /* Scrollable Notice Body */
    .reader-content-body {
      padding: 22px 20px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .notice-meta-summary {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }

    .formatted-notice-text {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #f1f5f9;
      white-space: pre-wrap;
      word-break: break-word;
      letter-spacing: 0.2px;
      padding-bottom: 20px;
      user-select: all;
    }

    /* Reader Fixed Action Bar */
    .reader-footer-actions {
      background: rgba(13, 19, 36, 0.95);
      border-top: 1px solid var(--card-border);
      padding: 14px 18px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-copy-modal-main {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #d97706);
      color: #ffffff;
      border: none;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.2s;
    }

    .btn-copy-modal-main:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
    }

    /* ==========================================================================
       6. TOAST NOTIFICATION
       ========================================================================== */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: #1e1b4b;
      border: 1px solid #6366f1;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 2000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-msg i {
      color: var(--accent);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Auth Gate Shield -->
  <div id="authGuard">
    <div class="guard-spinner"></div>
    <p style="color: #94a3b8; font-size: 0.88rem;">Connecting Portal... • নোটিশ লোড হচ্ছে...</p>
  </div>

  <!-- Ambient Glowing Mesh -->
  <div class="bg-mesh">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <!-- Top App Navigation Bar -->
  <header class="top-appbar">
    <div class="appbar-inner">
      <div class="left-controls">
        <a href="home.html" class="btn-back-home" title="Back to Home">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="brand-meta">
          <!-- Dynamic Website/Group Name loaded live from Firebase -->
          <h1 id="groupTitle">SS TIME OFFICIAL</h1>
          <span>Notice & Announcements • নোটিশ ও ঘোষণা</span>
        </div>
      </div>

      <div class="header-badge-count">
        <i class="fa-solid fa-bullhorn"></i>
        <span id="totalNoticesCount">0 Total</span>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="content-wrapper">

    <!-- Search Input (Search by Notice text, Serial #, Date) -->
    <div class="search-panel">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input 
        type="text" 
        id="noticeSearchInput" 
        class="search-input" 
        placeholder="Search notice, announcement, serial #1... / অনুসন্ধান..." 
      />
      <button id="clearSearchBtn" class="search-clear-btn">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Compact Notice Cards Grid -->
    <section class="notice-grid" id="noticeGridContainer">
      <!-- Dynamic Notice Cards Rendered Here -->
    </section>

  </main>

  <!-- Full Mobile Notice View (Modal Drawer) -->
  <div id="readerModal" class="reader-modal-overlay">
    <div class="reader-modal-sheet">
      
      <!-- Sticky Reader Header -->
      <div class="reader-header">
        <div class="reader-header-left">
          <button class="btn-close-reader" id="btnCloseReader" title="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="reader-title-box">
            <h3 id="readerNoticeTitle">📢 Notice / Announcement</h3>
            <span id="readerSubtitle">Full View</span>
          </div>
        </div>
        <span class="serial-badge" id="readerSerialBadge">#1</span>
      </div>

      <!-- Version Navigator Tabs (Switch without database mutation) -->
      <div class="version-navigator-bar" id="readerVersionBar">
        <!-- Dynamic Version Chips -->
      </div>

      <!-- Scrollable Notice Text Body -->
      <div class="reader-content-body">
        
        <div class="notice-meta-summary">
          <div>
            <strong style="color:var(--text-dim);">POSTED: </strong>
            <span id="readerSummaryDate" style="color: #f1f5f9; font-weight:600;">Date</span>
          </div>
          <div>
            <strong style="color:var(--text-dim);">VERSION: </strong>
            <span id="readerSummaryVersion" style="color: #6ee7b7; font-weight:700;">Latest</span>
          </div>
        </div>

        <div class="formatted-notice-text" id="readerNoticeBody">
          <!-- Full notice text with preserved line breaks, paragraphs, emojis -->
        </div>

      </div>

      <!-- Sticky Action Bottom Bar -->
      <div class="reader-footer-actions">
        <button class="btn-copy-modal-main" id="btnCopyModalNotice">
          <i class="fa-regular fa-clipboard"></i> Copy Notice / সম্পূর্ণ নোটিশ কপি করুন
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-msg">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">Notice copied ✓ • নোটিশ কপি হয়েছে ✓</span>
  </div>

  <!-- ==========================================================================
       6. JAVASCRIPT: REALTIME LOGIC & VERSION CONTROLLER
       ========================================================================== -->
  <script>
    // --------------------------------------------------------------------------
    // A. FIREBASE CONFIGURATION
    // --------------------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCjh-etprmOrbu7UMYNXXHdNXgiVPCxywY",
      authDomain: "alifi-1e15c.firebaseapp.com",
      databaseURL: "https://alifi-1e15c-default-rtdb.firebaseio.com",
      projectId: "alifi-1e15c",
      storageBucket: "alifi-1e15c.firebasestorage.app",
      messagingSenderId: "928673744418",
      appId: "1:928673744418:web:997a8db27cae1fa15c6c7b"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    // DOM Elements
    const authGuard = document.getElementById('authGuard');
    const groupTitle = document.getElementById('groupTitle');
    const totalNoticesCount = document.getElementById('totalNoticesCount');
    const noticeSearchInput = document.getElementById('noticeSearchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const noticeGridContainer = document.getElementById('noticeGridContainer');

    // Reader Modal Elements
    const readerModal = document.getElementById('readerModal');
    const btnCloseReader = document.getElementById('btnCloseReader');
    const readerNoticeTitle = document.getElementById('readerNoticeTitle');
    const readerSubtitle = document.getElementById('readerSubtitle');
    const readerSerialBadge = document.getElementById('readerSerialBadge');
    const readerVersionBar = document.getElementById('readerVersionBar');
    const readerSummaryDate = document.getElementById('readerSummaryDate');
    const readerSummaryVersion = document.getElementById('readerSummaryVersion');
    const readerNoticeBody = document.getElementById('readerNoticeBody');
    const btnCopyModalNotice = document.getElementById('btnCopyModalNotice');

    // Toast
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    // State Variables
    let rawNoticeData = [];
    let groupedNotices = [];
    let currentSearchTerm = '';
    let currentReadingGroup = null;
    let activeVersionIndex = 0;

    // --------------------------------------------------------------------------
    // B. AUTHENTICATION PROTECTION
    // --------------------------------------------------------------------------
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const userSnap = await db.ref(`users/${user.uid}`).once('value');
        if (!userSnap.exists()) {
          await auth.signOut();
          window.location.href = 'index.html';
          return;
        }

        const userData = userSnap.val();
        if (userData.status === 'blocked' || userData.isBlocked === true) {
          await auth.signOut();
          window.location.href = 'index.html';
          return;
        }

        authGuard.style.display = 'none';
        initRealtimeSync();

      } catch (err) {
        console.error("Auth guard error:", err);
        authGuard.style.display = 'none';
      }
    });

    // --------------------------------------------------------------------------
    // C. REALTIME FIREBASE DATABASE SYNC
    // --------------------------------------------------------------------------
    function initRealtimeSync() {
      // 1. Dynamic Group Title
      db.ref('settings/groupName').on('value', (snap) => {
        const titleVal = snap.val();
        if (titleVal && typeof titleVal === 'string' && titleVal.trim().length > 0) {
          groupTitle.textContent = titleVal.trim();
          document.title = `${titleVal.trim()} | Notice & Announcements`;
        }
      });

      // 2. Sync Notices from notices and contents nodes
      db.ref('notices').on('value', (snapNotices) => {
        const noticesObj = snapNotices.val() || {};

        db.ref('contents').on('value', (snapContents) => {
          const contentsObj = snapContents.val() || {};
          
          processAndGroupNotices({ ...noticesObj, ...contentsObj });
          renderNoticeList();
        });
      });
    }

    // --------------------------------------------------------------------------
    // D. NOTICE DATA PROCESSING & MULTI-VERSION GROUPING
    // --------------------------------------------------------------------------
    function processAndGroupNotices(mergedObj) {
      rawNoticeData = [];

      Object.keys(mergedObj).forEach(key => {
        const item = mergedObj[key];
        if (!item || typeof item !== 'object') return;

        // Skip unpublished or deleted entries
        const isHidden = item.status === 'unpublished' || item.status === 'deleted' || item.isPublished === false;
        if (isHidden) return;

        // Match items that are Notices, Announcements, or Other Updates
        const cat = (item.category || item.type || '').toLowerCase();
        const isNotice = cat.includes('notice') || 
                         cat.includes('announcement') || 
                         cat.includes('other') || 
                         cat.includes('comment') || 
                         cat.includes('event') ||
                         item.message;

        if (!isNotice && !cat.includes('general')) return;

        const noticeText = item.content || item.message || item.text || item.details || '';
        if (!noticeText.trim()) return;

        const headline = item.title || item.name || '📢 Notice / Announcement';

        rawNoticeData.push({
          id: key,
          headline: headline.trim(),
          noticeText: noticeText,
          versionLabel: item.version || item.ver || 'v1.0',
          versionNumber: parseVersionNumber(item.version || item.ver),
          timestamp: item.updatedAt || item.createdAt || item.date || Date.now()
        });
      });

      // Group versions belonging to the same Notice
      const groupsMap = {};

      rawNoticeData.forEach(item => {
        // Group key: Headline or first 25 characters of notice text
        const baseKey = item.headline ? item.headline.toLowerCase() : item.noticeText.trim().slice(0, 25).toLowerCase();
        const groupKey = `notice__${baseKey}`;

        if (!groupsMap[groupKey]) {
          groupsMap[groupKey] = {
            groupKey: groupKey,
            headline: item.headline,
            earliestTime: item.timestamp,
            latestTime: item.timestamp,
            versions: []
          };
        }

        if (item.timestamp < groupsMap[groupKey].earliestTime) {
          groupsMap[groupKey].earliestTime = item.timestamp;
        }
        if (item.timestamp > groupsMap[groupKey].latestTime) {
          groupsMap[groupKey].latestTime = item.timestamp;
        }

        groupsMap[groupKey].versions.push(item);
      });

      // Convert to array and assign Automatic Sequential Serial Numbers (#1, #2, #3...)
      groupedNotices = Object.values(groupsMap).sort((a, b) => a.earliestTime - b.earliestTime);

      groupedNotices.forEach((group, index) => {
        group.autoSerial = index + 1; // Automatic sequential serial #1, #2, #3

        // Sort versions descending (latest first)
        group.versions.sort((a, b) => {
          if (b.versionNumber !== a.versionNumber) {
            return b.versionNumber - a.versionNumber;
          }
          return b.timestamp - a.timestamp;
        });

        // Set pointer to the latest version
        group.latestVersion = group.versions[0];
      });

      totalNoticesCount.textContent = `${groupedNotices.length} Total`;
    }

    function parseVersionNumber(verStr) {
      if (!verStr) return 1;
      const match = verStr.toString().match(/\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : 1;
    }

    // --------------------------------------------------------------------------
    // E. RENDER COMPACT NOTICE CARDS
    // --------------------------------------------------------------------------
    function renderNoticeList() {
      const q = currentSearchTerm.toLowerCase().trim();

      const filtered = groupedNotices.filter(group => {
        if (q) {
          const serialMatch = `#${group.autoSerial}`.includes(q) || group.autoSerial.toString() === q;
          const headlineMatch = group.headline.toLowerCase().includes(q);
          const textMatch = group.versions.some(v => v.noticeText.toLowerCase().includes(q));

          if (!serialMatch && !headlineMatch && !textMatch) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        noticeGridContainer.innerHTML = `
          <div class="empty-placeholder">
            <i class="fa-solid fa-bell-slash"></i>
            <p>কোনো Notice পাওয়া যায়নি • No Notice found</p>
          </div>
        `;
        return;
      }

      noticeGridContainer.innerHTML = filtered.map(group => {
        const latest = group.latestVersion;
        const formattedDate = new Date(group.latestTime).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        return `
          <div class="notice-compact-card">
            <div>
              <div class="card-top-row">
                <span class="serial-badge">#${group.autoSerial}</span>
                <div class="version-tag-pill">
                  <i class="fa-solid fa-sparkles"></i> Latest (${escapeHTML(latest.versionLabel)})
                  ${group.versions.length > 1 ? `<span style="color:#94a3b8; font-size:0.65rem;">(+${group.versions.length - 1} old)</span>` : ''}
                </div>
              </div>

              <h4 class="notice-headline">
                <i class="fa-solid fa-bullhorn"></i>
                ${escapeHTML(group.headline)}
              </h4>

              <div class="notice-text-box">${escapeHTML(latest.noticeText)}</div>

              <div class="card-bottom-meta">
                <span><i class="fa-regular fa-clock"></i> Posted: ${formattedDate}</span>
                <span>${group.versions.length} Version${group.versions.length > 1 ? 's' : ''}</span>
              </div>
            </div>

            <div class="card-action-bar">
              <button class="btn-card btn-primary-view" onclick="openNoticeReader('${group.groupKey}')">
                <i class="fa-solid fa-book-open"></i> Read Full / বিস্তারিত
              </button>
              <button class="btn-card btn-copy-card" onclick="copyNoticeDirect('${group.groupKey}')">
                <i class="fa-regular fa-copy"></i> Copy
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --------------------------------------------------------------------------
    // F. FULL MOBILE NOTICE VIEW & IN-VIEW VERSION SWITCHER
    // --------------------------------------------------------------------------
    window.openNoticeReader = function(groupKey) {
      const group = groupedNotices.find(g => g.groupKey === groupKey);
      if (!group) return;

      currentReadingGroup = group;
      activeVersionIndex = 0; // Default to Latest

      readerNoticeTitle.textContent = group.headline;
      readerSubtitle.textContent = `${group.versions.length} Version${group.versions.length > 1 ? 's' : ''} available`;
      readerSerialBadge.textContent = `#${group.autoSerial}`;

      renderReaderVersionTabs();
      renderActiveNoticeBody();

      readerModal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    function renderReaderVersionTabs() {
      if (!currentReadingGroup) return;

      readerVersionBar.innerHTML = currentReadingGroup.versions.map((ver, idx) => {
        const isLatest = idx === 0;
        const label = isLatest ? `Latest (${ver.versionLabel})` : `Version ${ver.versionLabel}`;
        return `
          <button class="version-tab-btn ${idx === activeVersionIndex ? 'active' : ''}" onclick="switchReaderVersion(${idx})">
            ${isLatest ? '<i class="fa-solid fa-bolt"></i> ' : ''}${escapeHTML(label)}
          </button>
        `;
      }).join('');
    }

    window.switchReaderVersion = function(index) {
      activeVersionIndex = index;
      renderReaderVersionTabs();
      renderActiveNoticeBody();
    };

    function renderActiveNoticeBody() {
      if (!currentReadingGroup) return;
      const currentVer = currentReadingGroup.versions[activeVersionIndex];
      const isLatest = activeVersionIndex === 0;

      readerSummaryDate.textContent = new Date(currentVer.timestamp).toLocaleDateString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
      readerSummaryVersion.textContent = isLatest ? `Latest (${currentVer.versionLabel})` : `Version ${currentVer.versionLabel} (Old)`;

      // Preserve line breaks, paragraphs, emojis
      readerNoticeBody.textContent = currentVer.noticeText;
    }

    // Close Modal Reader
    btnCloseReader.addEventListener('click', () => {
      readerModal.style.display = 'none';
      document.body.style.overflow = 'auto';
      currentReadingGroup = null;
    });

    readerModal.addEventListener('click', (e) => {
      if (e.target === readerModal) {
        readerModal.style.display = 'none';
        document.body.style.overflow = 'auto';
        currentReadingGroup = null;
      }
    });

    // --------------------------------------------------------------------------
    // G. COPY SYSTEM & CLIPBOARD
    // --------------------------------------------------------------------------
    window.copyNoticeDirect = function(groupKey) {
      const group = groupedNotices.find(g => g.groupKey === groupKey);
      if (!group) return;
      const textToCopy = group.latestVersion.noticeText;
      copyTextToClipboard(textToCopy, 'Notice copied ✓ • নোটিশ কপি হয়েছে ✓');
    };

    btnCopyModalNotice.addEventListener('click', () => {
      if (!currentReadingGroup) return;
      const currentVer = currentReadingGroup.versions[activeVersionIndex];
      copyTextToClipboard(currentVer.noticeText, 'Notice copied ✓ • নোটিশ কপি হয়েছে ✓');
    });

    function copyTextToClipboard(text, successMessage) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMessage);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMessage);
      });
    }

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    // --------------------------------------------------------------------------
    // H. SEARCH LISTENERS
    // --------------------------------------------------------------------------
    noticeSearchInput.addEventListener('input', (e) => {
      currentSearchTerm = e.target.value;
      clearSearchBtn.style.display = currentSearchTerm ? 'block' : 'none';
      renderNoticeList();
    });

    clearSearchBtn.addEventListener('click', () => {
      noticeSearchInput.value = '';
      currentSearchTerm = '';
      clearSearchBtn.style.display = 'none';
      renderNoticeList();
      noticeSearchInput.focus();
    });

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
